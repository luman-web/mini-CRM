name: Проверка и публикация

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Проверка и сборка
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v6

      - name: Установка Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка кода
        run: npm run lint

      - name: Проверка переменных production
        if: github.event_name != 'pull_request'
        run: test -n "$VITE_SUPABASE_URL" && test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"

      - name: Production-сборка
        run: npm run build

      - name: Настройка GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Подготовка артефакта GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Публикация GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Публикация
        id: deployment
        uses: actions/deploy-pages@v4
